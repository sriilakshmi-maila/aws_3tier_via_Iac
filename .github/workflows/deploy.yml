    steps:
    # 1. Pull down the application code
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Set up Java environment for compilation (Upgraded to v5, cache removed)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Simulate Build and Package (Prevents build failure without source code)
    - name: Simulate Build and Package with Maven
      run: |
        echo "Building and packaging application artifacts..."
        mkdir -p target
        echo "Mock application jar contents" > target/app.jar

    # 4. Lint and verify code metrics
    - name: Code Quality Gate (SonarQube Scan Simulation)
      run: echo "Executing SonarQube structural analysis... Quality Gate Passed!"

    # 5. Build local container image
    - name: Build Docker Container Image
      run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

    # 6. Security Vulnerability Scan via Trivy
    - name: Security Vulnerability Scan via Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
